workflows:
  bumperz-upload-testflight:
    name: BumperZ - Fix icon and upload IPA to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: BumperZ
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bumperz.game
    scripts:
      - name: Patch App Store icon and re-sign IPA
        script: |
          test -f "$CM_BUILD_DIR/ci-upload/BumperZ.ipa"
          bash "$CM_BUILD_DIR/ci/patch_ios_app_icon.sh"
    artifacts:
      - build/BumperZ-fixed.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  bumperz-ios-testflight:
    name: BumperZ iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: BumperZ
    environment:
      unity: 6000.5.6f1
      groups:
        - unity_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bumperz.game
      vars:
        UNITY_IOS_DIR: build/ios
        XCODE_PROJECT: Unity-iPhone.xcodeproj
        XCODE_SCHEME: Unity-iPhone
        APP_VERSION: 1.0.0
    cache:
      cache_paths:
        - $CM_BUILD_DIR/Library
    scripts:
      - name: Validate required Unity credentials
        script: |
          : "${UNITY_EMAIL:?Add UNITY_EMAIL to the unity_credentials group}"
          : "${UNITY_PASSWORD:?Add UNITY_PASSWORD to the unity_credentials group}"
          : "${UNITY_SERIAL:?Add UNITY_SERIAL to the unity_credentials group}"
      - name: Activate Unity license
        script: |
          "$UNITY_HOME/Contents/MacOS/Unity" -batchmode -quit -logFile - \
            -serial "$UNITY_SERIAL" \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD"
      - name: Export Xcode project from Unity
        script: |
          export NEW_BUILD_NUMBER="$CM_BUILD_NUMBER"
          "$UNITY_HOME/Contents/MacOS/Unity" -batchmode -quit -nographics -logFile - \
            -projectPath "$CM_BUILD_DIR" \
            -executeMethod BuildScript.BuildIos
      - name: Apply iOS signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$UNITY_IOS_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - build/ios/**/*.xcarchive
    publishing:
      scripts:
        - name: Return Unity license
          script: |
            "$UNITY_HOME/Contents/MacOS/Unity" -batchmode -quit -logFile - \
              -returnlicense -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" || true
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  bumperz-android-aab:
    name: BumperZ Android - AAB
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      unity: 6000.5.6f1
      groups:
        - unity_credentials
      android_signing:
        - bumperz_keystore
      vars:
        UNITY_ANDROID_PATH: build/android/BumperZ.aab
        APP_VERSION: 1.0.0
    cache:
      cache_paths:
        - $CM_BUILD_DIR/Library
    scripts:
      - name: Validate required Unity credentials
        script: |
          : "${UNITY_EMAIL:?Add UNITY_EMAIL to the unity_credentials group}"
          : "${UNITY_PASSWORD:?Add UNITY_PASSWORD to the unity_credentials group}"
          : "${UNITY_SERIAL:?Add UNITY_SERIAL to the unity_credentials group}"
      - name: Activate Unity license
        script: |
          "$UNITY_HOME/Contents/MacOS/Unity" -batchmode -quit -logFile - \
            -serial "$UNITY_SERIAL" \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD"
      - name: Build signed Android App Bundle
        script: |
          export NEW_BUILD_NUMBER="$CM_BUILD_NUMBER"
          "$UNITY_HOME/Contents/MacOS/Unity" -batchmode -quit -nographics -logFile - \
            -projectPath "$CM_BUILD_DIR" \
            -executeMethod BuildScript.BuildAndroid
    artifacts:
      - build/android/*.aab
      - build/android/*.apk
    publishing:
      scripts:
        - name: Return Unity license
          script: |
            "$UNITY_HOME/Contents/MacOS/Unity" -batchmode -quit -logFile - \
              -returnlicense -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" || true
